# XcodeGen spec. Regenerate the project after adding/removing files or changing settings:
#   xcodegen generate
name: SquareOff
options:
  bundleIdPrefix: com.novastrada
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SquareOffKit:
    path: Packages/SquareOffKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SquareOff:
    type: application
    platform: iOS
    sources:
      - path: SquareOff
    dependencies:
      # The app links only the rules package. SquareOffNet (server DTOs + clients) stays in the
      # repo with its contract tests, but nothing in the v1 game flow talks to a server.
      - package: SquareOffKit
        product: SquareOffCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novastrada.squareoff
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: SquareOff/Info.plist
      properties:
        CFBundleDisplayName: Square Off
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Dark-only for v1.
        UIUserInterfaceStyle: Dark
        # Lets custom animations (tile spins) run at 120Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  SquareOffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SquareOffTests
    dependencies:
      - target: SquareOff
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novastrada.squareoff.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SquareOff:
    build:
      targets:
        SquareOff: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SquareOffTests
        - package: SquareOffKit/SquareOffCoreTests
        - package: SquareOffKit/SquareOffNetTests
