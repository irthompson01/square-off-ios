# XcodeGen spec. Regenerate the project after adding/removing files or changing settings:
#   xcodegen generate
name: SquareOff
options:
  bundleIdPrefix: com.novastrada
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  SquareOffKit:
    path: Packages/SquareOffKit

settings:
  base:
    # Signing: automatic with the Individual team (archives and `make phone` need it).
    DEVELOPMENT_TEAM: 5M999SV4VM
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SquareOff:
    type: application
    platform: iOS
    sources:
      - path: SquareOff
    dependencies:
      - package: SquareOffKit
        product: SquareOffCore
      # Server clients (live docker + in-app mock), picked at runtime by BackendConfiguration.
      - package: SquareOffKit
        product: SquareOffNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novastrada.squareoff
        TARGETED_DEVICE_FAMILY: "1,2"
        # `make bump [VERSION=x.y.z] [BUILD=n]` edits these two; the generated Info.plist reads them.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Both entitlements files are hand-maintained (an XcodeGen `entitlements:` key would
        # force one file on every configuration): Sign in with Apple, universal links for
        # square-off.com and www.square-off.com (invite, password-reset and verify-email
        # links; the AASA is served by Caddy) and password AutoFill.
        CODE_SIGN_ENTITLEMENTS: SquareOff/SquareOff.entitlements
      configs:
        # Same list with `applinks:…?mode=developer`, so a device with Settings › Developer ›
        # Associated Domains Development on skips Apple's CDN copy of the AASA.
        Debug:
          CODE_SIGN_ENTITLEMENTS: SquareOff/SquareOffDebug.entitlements
    info:
      path: SquareOff/Info.plist
      properties:
        CFBundleDisplayName: Square Off
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.board-games
        # HTTPS only (no custom cryptography), so no export compliance paperwork per build.
        ITSAppUsesNonExemptEncryption: false
        # Grapple (wordmark) and Chakra Petch Bold (headings, numbers), as on the web.
        UIAppFonts:
          - Grapple.ttf
          - ChakraPetch-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Dark-only for v1.
        UIUserInterfaceStyle: Dark
        # Lets custom animations (tile spins) run at 120Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # squareoff://auth?token=… (OAuth return) and squareoff://join/<code> (invites).
        CFBundleURLTypes:
          - CFBundleURLName: com.novastrada.squareoff
            CFBundleURLSchemes: [squareoff]

  SquareOffTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SquareOffTests
    dependencies:
      - target: SquareOff
      - package: SquareOffKit
        product: SquareOffNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novastrada.squareoff.tests
        GENERATE_INFOPLIST_FILE: YES

  # The admin console: the same app code plus SquareOffAdmin/, its own bundle id and icon,
  # never submitted to the store. Sign in with Apple works (the server accepts
  # `<bundle id>.admin` as a native audience); no URL scheme (it must not compete with
  # Square Off for squareoff://).
  SquareOffAdmin:
    type: application
    platform: iOS
    sources:
      - path: SquareOff
        excludes:
          - "Info.plist"
          - "SquareOff.entitlements"
          - "SquareOffDebug.entitlements"
      - path: SquareOffAdmin
    dependencies:
      - package: SquareOffKit
        product: SquareOffCore
      - package: SquareOffKit
        product: SquareOffNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novastrada.squareoff.admin
        CODE_SIGN_ENTITLEMENTS: SquareOffAdmin/SquareOffAdmin.entitlements
        PRODUCT_NAME: SquareOffAdmin
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ADMIN_CONSOLE"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconAdmin
    info:
      path: SquareOffAdmin/Info.plist
      properties:
        CFBundleDisplayName: Square Off Admin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Grapple.ttf
          - ChakraPetch-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  SquareOffAdminTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SquareOffAdminTests
    dependencies:
      - target: SquareOffAdmin
      - package: SquareOffKit
        product: SquareOffNet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novastrada.squareoff.admin.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ADMIN_CONSOLE"

schemes:
  SquareOffAdmin:
    build:
      targets:
        SquareOffAdmin: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SquareOffAdminTests

  SquareOff:
    build:
      targets:
        SquareOff: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SquareOffTests
        - package: SquareOffKit/SquareOffCoreTests
        - package: SquareOffKit/SquareOffNetTests
